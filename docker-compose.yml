services:
  epialert:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Without this the session key is regenerated on every restart and all
      # logins are invalidated. Set it in a .env file next to this one.
      EPIALERT_SECRET_KEY: ${EPIALERT_SECRET_KEY:?set EPIALERT_SECRET_KEY in .env}
      # Never sends real messages unless deliberately changed to "live".
      SMS_MODE: ${SMS_MODE:-mock}
      # Reach an Ollama running on the host, not inside this container.
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
    volumes:
      # Database and dataset live outside the image so rebuilds never lose data.
      - ./epialert_demo.db:/app/epialert_demo.db
      - ./data:/app/data
      - ./results:/app/results:ro
    extra_hosts:
      # Lets the container reach Ollama on the host machine (Linux needs this
      # explicitly; Docker Desktop provides it already).
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
